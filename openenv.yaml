name: support_ops_env
description: Deterministic customer support ticket resolution environment with classification, response generation, and escalation workflows.
entrypoint: app:app
environment_class: env.environment:SupportEnv
inference_script: inference.py
api_routes:
  reset:
    method: POST
    path: /reset
  step:
    method: POST
    path: /step
  state:
    method: GET
    path: /state
tasks:
  - easy
  - medium
  - hard
